profile: umccr-data-control-prod/AWSAdministratorAccess

# Account and region owning the ledger, the manifest bucket, and every dataset
# bucket and key. Read by the direct-read S3 mechanism, which writes the account
# into its policy documents and conditions decrypt on the region.
account: "916218008751"
region: ap-southeast-2

# The record store both mechanisms write to.
ledger:
  table: data-releaser-ShareRecords

# Manifest delivery. The bucket is shared; each mechanism has its own key prefix.
manifest:
  bucket: data-releaser-manifests-916218008751

# --- htsget mechanism -------------------------------------------------

warehouse:
  athenaWorkgroup: data-releaser-mock
  database: mart_mock
  catalog: AwsDataCatalog

endpoints:
  authorization: https://kcupgo60cj.execute-api.ap-southeast-2.amazonaws.com/prod/authorize
  htsgetBaseUrl: https://htsget-lattice.data-control.umccr.org
  apiGatewayRestApiId: kcupgo60cj
  apiGatewayStageName: prod

validation:
  skipHtsgetCheck: true
  skipAuthorizationCheck: true

researchers:
  "534840902377":
    targetVpcArn: arn:aws:ec2:ap-southeast-2:534840902377:vpc/vpc-031e3d24ea0e50664

# --- direct-read S3 mechanism -----------------------------------------

s3:
  copy:
    stateMachineArn: arn:aws:states:ap-southeast-2:916218008751:stateMachine:StepsS3CopyStateMachine157A1409-5xNTDd7ygq6h
    workingBucket: stepss3copy-working66f7dd3f-rpaeqxpmf4ys
    workingBucketPrefix: ""
    writerRoleName: steps-s3-copy-role

    # How hard a copy may run against the source store. Omitted settings keep the copy
    # orchestration's own defaults, which suit a source that scales with the load put on
    # it. The Ceph endpoint does not: at the defaults the large-object transfers saturate
    # its link, and the failure surfaces in the small-object copies queued behind them,
    # which time out and fail the whole run.
    performance:
      largeCopyConcurrency: 24
      smallCopyBatchSize: 16
  source:
    endpointUrl: https://objects.storage.unimelb.edu.au
    region: ap-southeast-2
    credentialsSecret: arn:aws:secretsmanager:ap-southeast-2:916218008751:secret:ceph-5180-guardians-node-20260527050213626500000001-GdfFZ7  # pragma: allowlist secret
  hotCache:
    namePrefix: data-releaser
    obscureBucketNames: false
    buckets:
      "s3://5180-guardians-node/cup_test/": cache-cup-test
      "s3://5180-guardians-node/cup/": cache-cup-dataset-916218008751-ap-southeast-2
  manifest:
    keyTemplate: "datasets/{accountId}/manifest.json"
