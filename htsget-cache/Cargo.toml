[package]
name = "htsget-cache"
version = "0.1.0"
edition = "2021"
description = "In-process authorization response cache for htsget-rs callout client"
license = "MIT"

[dependencies]
moka = { version = "0.12", features = ["sync", "future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
